        system_state: fire

      - valve_id: lffv
        action: closed
        time_delay: 0.0
        user_input: true
        system_state: fire
  
      - valve_id: otvv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fire

      - valve_id: xffv
        action: closed
        time_delay: 0.0
        user_input: true
        system_state: fire   
      
      - valve_id: ftvv
        action: open
        time_delay: 0.0
        user_input: true
