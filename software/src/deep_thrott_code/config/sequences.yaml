sequences:
  - name: fill
    steps:
      - valve_id: ftvv
        action: closed
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: otvv
        action: closed
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: lffv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: otvv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: offv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: offv
        action: closed
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: otvv
        action: closed
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: xffv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: omctv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fill

      - valve_id: fmctv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fill
      
      - valve_id: otfv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fill

