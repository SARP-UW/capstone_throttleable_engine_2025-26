# hotfire seq

  - name: fire
    steps:
      - valve_id: otfv
        action: open
        time_delay: 0.0
        user_input: false
        system_state: fire

      - valve_id: wmv
        action: open
        time_delay: 4.0
        user_input: false
        system_state: fire

      - valve_id: oifv
        action: open
        time_delay: 0.2
        user_input: false
        system_state: fire
      
      - valve_id: fifv
        action: open
        time_delay: 2.0
        user_input: false
        system_state: fire

      - valve_id: omv
        action: open
        time_delay: 0.0
        user_input: false
        system_state: fire

      - valve_id: fmv
        action: open
        time_delay: 6.0
        user_input: false
        system_state: fire

      # - valve_id: fmctv
