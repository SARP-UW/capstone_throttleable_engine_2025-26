# hotfire 2 second sequence

  - name: fire
    steps:
      - valve_id: wmv
        action: open
        time_delay: 4.0
        user_input: false
        system_state: fire

      - valve_id: oifv
        action: open
        time_delay: 0.1
        user_input: false
        system_state: fire
      
      - valve_id: fifv
        action: open
        time_delay: 2.0
        user_input: false
        system_state: fire

      - valve_id: omv
        action: open
        time_delay: 0.0
        user_input: false
        system_state: fire

      - valve_id: fmv
        action: open
        time_delay: 4.0
        user_input: false
        system_state: fire

      - valve_id: fmctv
        action: throttle
        angle: 77.0
        time: 1.0
        time_delay: 0.0
        user_input: false
        system_state: fire

      - valve_id: omctv
        action: throttle
        angle: 77.0
        time: 1.0
        time_delay: 2.0
        user_input: false
        system_state: fire
      
      - valve_id: oifv   # double check with Oliver
        action: closed
        time_delay: 4.0
        user_input: false
        system_state: fire

      - valve_id: lffv
        action: closed
        time_delay: 0.0
        user_input: false
        system_state: fire
        
      # manual purge steps after hotfire sequence
      - valve_id: xffv
        action: closed
        time_delay: 0.0
        user_input: true
        system_state: fire   
      
      - valve_id: ftvv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fire
      
      - valve_id: otvv
        action: open
        time_delay: 0.0
        user_input: true
        system_state: fire